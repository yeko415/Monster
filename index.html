<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>3D Monster Test</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020402;color:#fff;font-family:Arial,Helvetica,sans-serif}body{overflow:hidden}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr;background:radial-gradient(circle at 50% 45%,rgba(117,255,0,.10),transparent 25%),#020402}.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);z-index:5}.brand{font-weight:900;letter-spacing:.15em;color:#76ff00}.status{font-size:12px;color:#9aa39a}.stage{position:relative;min-height:0}.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.ui{position:absolute;left:20px;top:20px;z-index:4;max-width:360px}.ui h1{font-size:clamp(38px,6vw,72px);line-height:.88;margin:0}.ui h1 span{color:#76ff00}.ui p{color:#8a938a;line-height:1.5;font-size:13px}.controls{position:absolute;right:20px;bottom:20px;display:flex;gap:10px;z-index:4}.btn{width:54px;height:54px;border:1px solid rgba(117,255,0,.5);background:rgba(0,0,0,.45);color:#fff;font-size:22px;cursor:pointer}.btn:hover{color:#76ff00;border-color:#76ff00}.hint{position:absolute;right:20px;top:22px;z-index:4;color:#747c74;font-size:10px;letter-spacing:.16em}.loader{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;text-align:center;color:#8c968c;font-size:12px;pointer-events:none}.spinner{width:42px;height:42px;border:2px solid rgba(117,255,0,.18);border-top-color:#76ff00;border-radius:50%;margin:0 auto 12px;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{color:#ff7777;max-width:310px;text-align:center;line-height:1.5}.floor{position:absolute;left:-10%;right:-10%;bottom:-16%;height:45%;transform:perspective(500px) rotateX(62deg);background-image:linear-gradient(rgba(117,255,0,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(117,255,0,.12) 1px,transparent 1px);background-size:52px 52px;mask-image:linear-gradient(to top,#000,transparent);pointer-events:none}.ring{position:absolute;left:50%;top:56%;width:min(420px,60vw);aspect-ratio:1;transform:translate(-50%,-50%);border:1px solid rgba(117,255,0,.14);border-radius:50%;pointer-events:none}
@media(max-width:700px){.ui{left:16px;top:16px;max-width:260px}.ui p{font-size:12px}.hint{right:16px;top:18px;font-size:9px}.controls{right:16px;bottom:16px}.top{padding:14px 16px}.status{font-size:11px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script>
</head>
<body>
<div class="wrap">
  <header class="top"><div class="brand">MONSTER</div><div id="status" class="status">3D MODEL HAZIRLANIYOR...</div></header>
  <main class="stage" id="stage">
    <div class="ui"><h1>UNLEASH<br><span>THE ENERGY</span></h1><p>Bu sayfa sadece mekanizmayı test ediyor: ortada gerçek 3D kutu, sağ/sol geçiş ve parmakla döndürme.</p></div>
    <div class="hint">DRAG / SWIPE</div>
    <div class="ring"></div><div class="floor"></div>
    <div id="loader" class="loader"><div class="spinner"></div>Monster yükleniyor...</div>
    <canvas id="c"></canvas>
    <div class="controls"><button class="btn" id="left" type="button" aria-label="Sola çevir">←</button><button class="btn" id="right" type="button" aria-label="Sağa çevir">→</button></div>
  </main>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/loaders/GLTFLoader.js';

const canvas=document.getElementById('c');
const stage=document.getElementById('stage');
const loaderEl=document.getElementById('loader');
const statusEl=document.getElementById('status');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(35,1,.01,100);
camera.position.set(0,.1,5.5);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.35;
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
scene.add(new THREE.AmbientLight(0xffffff,1.7));
const key=new THREE.DirectionalLight(0xffffff,4.5);key.position.set(3,4,5);scene.add(key);
const rim=new THREE.PointLight(0x76ff00,18,9);rim.position.set(-2,1.5,2.5);scene.add(rim);
const fill=new THREE.PointLight(0x99ffcc,8,8);fill.position.set(2,-1,2);scene.add(fill);
const product=new THREE.Group();scene.add(product);
let model=null,targetY=0,currentY=0,dragging=false,lastX=0;
function resize(){const r=stage.getBoundingClientRect();const w=Math.max(1,r.width),h=Math.max(1,r.height);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
const gltfLoader=new GLTFLoader();
gltfLoader.load('./assets/source/baatli.glb',g=>{
 model=g.scene;
 model.traverse(o=>{if(o.isMesh){o.castShadow=false;o.receiveShadow=false;if(o.material){o.material.needsUpdate=true}}});
 const box=new THREE.Box3().setFromObject(model);
 const size=box.getSize(new THREE.Vector3());
 const center=box.getCenter(new THREE.Vector3());
 model.position.sub(center);
 const max=Math.max(size.x,size.y,size.z);
 if(!Number.isFinite(max)||max<=0){throw new Error('Model ölçüsü okunamadı');}
 model.scale.setScalar(3.15/max);
 // Biraz yukarı al; kutu zeminin içine gömülmesin.
 model.position.y=.05;
 product.add(model);
 loaderEl.style.display='none';
 statusEl.textContent='3D MODEL YÜKLENDİ';
},xhr=>{
 if(xhr.total){const p=Math.round(xhr.loaded/xhr.total*100); statusEl.textContent='MODEL %'+p;}
},e=>{
 console.error(e);loaderEl.innerHTML='<div class="error">Model yüklenemedi.<br>GitHub Pages üzerinde tekrar açıp konsolu kontrol edebiliriz.</div>';
 statusEl.textContent='MODEL HATASI';
});
function turn(dir){targetY+=dir*Math.PI*.85;}
document.getElementById('left').addEventListener('click',()=>turn(-1));
document.getElementById('right').addEventListener('click',()=>turn(1));
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;targetY+=dx*.009});
for(const ev of ['pointerup','pointercancel'])canvas.addEventListener(ev,()=>dragging=false);
function animate(){requestAnimationFrame(animate);currentY+=(targetY-currentY)*.09;if(model){model.rotation.y=currentY;model.position.y=.04+Math.sin(performance.now()*.001)*.025;}renderer.render(scene,camera)}
animate();
</script>
</body>
</html>
